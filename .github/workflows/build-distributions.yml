name: Build Desktop Packages

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag (e.g. v1.1.1)
  workflow_dispatch:
    inputs:
      version:
        description: Application version to package (for example, 1.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-packages:
    name: Build package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: ':app:packageMsi'
            artifact-path: 'app/build/compose/binaries/main/msi/'
          - os: macos-latest
            task: ':app:packageDmg'
            artifact-path: 'app/build/compose/binaries/main/dmg/'

    steps:
      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REQUESTED_VERSION:-${REF_NAME#v}}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid application version: $version (expected MAJOR.MINOR.BUILD)" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          build=$((10#${BASH_REMATCH[3]}))
          if (( major > 255 || minor > 255 || build > 65535 )); then
            echo "Application version exceeds MSI limits: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: 'ARES-Analytics'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native package
        run: |
          cd ARES-Analytics
          chmod +x ./gradlew
          ./gradlew ${{ matrix.task }} "-ParesAnalyticsVersion=${{ steps.version.outputs.version }}" --no-daemon
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARES-Analytics-${{ matrix.os }}
          path: ARES-Analytics/${{ matrix.artifact-path }}

      # 4. Create Release and Upload Assets (Runs only on tag push)
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ARES-Analytics/${{ matrix.artifact-path }}/*.msi
            ARES-Analytics/${{ matrix.artifact-path }}/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
