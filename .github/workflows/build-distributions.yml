name: Build Desktop Packages

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag (e.g. v1.1.1)
  workflow_dispatch:
    inputs:
      version:
        description: Application version to package (for example, 1.1.1)
        required: true
        type: string
      publish:
        description: Create the version tag and public GitHub Release after all package checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ARES_VERSION: 9.7.0

jobs:
  zero-code-project-acceptance:
    name: Verify fresh zero-code robot projects
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: 'ARES-Analytics'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download hash-pinned robot templates
        shell: pwsh
        run: |
          $archiveDirectory = Join-Path $env:RUNNER_TEMP 'ares-official-templates'
          New-Item -ItemType Directory -Force -Path $archiveDirectory | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/ARES-23247/ARES-FTC-Starter/releases/download/v9.7.0/ARES-FTC-Starter-9.7.0.zip' `
            -OutFile (Join-Path $archiveDirectory 'ftc.zip')
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/ARES-23247/ARES-FRC-Starter/releases/download/v9.7.0/ARES-FRC-Starter-9.7.0.zip' `
            -OutFile (Join-Path $archiveDirectory 'frc.zip')
          $expectedHashes = @{
            'ftc.zip' = 'f2ab2d04f2a97195b61feb7931c0690a938a8260960868fbf0dc14252c74b865'
            'frc.zip' = 'fd823a8b626506696f42e60831acffeba99887f0147bbdcb30fe7e4ff8d6b3f8'
          }
          foreach ($entry in $expectedHashes.GetEnumerator()) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $archiveDirectory $entry.Key)).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "Pinned $($entry.Key) hash mismatch: expected $($entry.Value), received $actual"
            }
          }

      - name: Create, generate, test, simulate, and package fresh projects
        shell: pwsh
        run: |
          $archiveDirectory = Join-Path $env:RUNNER_TEMP 'ares-official-templates'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'ares-zero-code-acceptance'
          Set-Location ARES-Analytics
          .\gradlew.bat :app:test `
            --tests 'com.ares.analytics.service.project.OfficialProjectTemplateIntegrationTest' `
            "-Dares.officialTemplateArchiveDir=$archiveDirectory" `
            "-Dares.officialTemplateOutputDir=$outputDirectory" `
            '-Dares.officialTemplateValidateProjects=true' `
            --no-daemon --console=plain

      - name: Upload zero-code project logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-code-project-acceptance-logs
          path: ${{ runner.temp }}/ares-zero-code-acceptance/**/official-template-validation.log
          if-no-files-found: warn

  build-packages:
    name: Build package for ${{ matrix.os }}
    needs: zero-code-project-acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: ':app:packageReleaseMsi'
            artifact-path: 'app/build/compose/binaries/main-release/msi/'
          - os: macos-latest
            task: ':app:packageReleaseDmg'
            artifact-path: 'app/build/compose/binaries/main-release/dmg/'

    steps:
      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REQUESTED_VERSION:-${REF_NAME#v}}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid application version: $version (expected MAJOR.MINOR.BUILD)" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          build=$((10#${BASH_REMATCH[3]}))
          if (( major > 255 || minor > 255 || build > 65535 )); then
            echo "Application version exceeds MSI limits: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: 'ARES-Analytics'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify immutable ARES release is available
        shell: bash
        run: >-
          curl --fail --silent --show-error --head
          "https://raw.githubusercontent.com/ARES-23247/ARESLib-Kotlin/maven/org/aresfirst/ares/ares-bom/${ARES_VERSION}/ares-bom-${ARES_VERSION}.pom"

      - name: Build native package
        env:
          ARES_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.ARES_GOOGLE_OAUTH_CLIENT_ID }}
          ARES_GOOGLE_OAUTH_BROKER_URL: ${{ vars.ARES_GOOGLE_OAUTH_BROKER_URL }}
          ARES_GITHUB_APP_CLIENT_ID: ${{ vars.ARES_GITHUB_APP_CLIENT_ID }}
          ARES_GITHUB_APP_SLUG: ${{ vars.ARES_GITHUB_APP_SLUG }}
        run: |
          cd ARES-Analytics
          chmod +x ./gradlew
          # Public OAuth application identity and broker endpoint are supplied through protected
          # repository variables. Keeping them out of command arguments avoids unnecessary logs.
          ./gradlew ${{ matrix.task }} "-ParesAnalyticsVersion=${{ steps.version.outputs.version }}" --no-daemon
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARES-Robotics-Studio-${{ matrix.os }}
          path: ARES-Analytics/${{ matrix.artifact-path }}

  publish-release:
    name: Publish verified desktop release
    needs: build-packages
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release identity
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF" != "refs/heads/master" ]]; then
            echo "Public releases may only be dispatched from the protected master branch (received $REF)." >&2
            exit 1
          fi
          version="${REQUESTED_VERSION:-${REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=ARES Robotics Studio $version" >> "$GITHUB_OUTPUT"

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: ARES-Robotics-Studio-*
          merge-multiple: true
          path: release-assets

      - name: Inventory release assets
        shell: bash
        run: find release-assets -maxdepth 4 -type f -print

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.msi
            release-assets/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
