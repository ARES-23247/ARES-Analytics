name: Dashboard Validation

on:
  # This job is a required branch-protection check, so every pull request must
  # schedule it. Path filtering would leave documentation and dependency-only
  # pull requests permanently pending with no check run to satisfy protection.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/dashboard-validation.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - soak

permissions:
  contents: read

# Validation is pinned to the protected ARESLib commit that defines the 6.2.0 contract used by
# Analytics. Native release packaging intentionally remains Maven-Central-only.
env:
  ARES_VERSION: 6.2.0
  ARESLIB_VALIDATION_REF: 02d5c2de23007ec7b3d3be6b2d20906e2b23d5c5
  ARES_VALIDATION_REPOSITORY: file://${{ github.workspace }}/ARESLib-Kotlin/build/release-repository

concurrency:
  group: dashboard-validation-${{ github.ref }}-${{ github.event.inputs.profile || 'automatic' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'schedule' && github.event.inputs.profile != 'soak'
    name: Dashboard smoke and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated ARESLib contract
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: ${{ env.ARESLIB_VALIDATION_REF }}
          path: ARESLib-Kotlin

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish isolated ARESLib validation repository
        working-directory: ARESLib-Kotlin
        run: ./gradlew publishReleaseValidation "-ParesVersion=${ARES_VERSION}" --no-parallel --no-daemon

      - name: Verify the requested ARES contract was published
        working-directory: ARESLib-Kotlin
        run: test -f "build/release-repository/org/aresfirst/ares/ares-bom/${ARES_VERSION}/ares-bom-${ARES_VERSION}.pom"

      - name: Run dashboard smoke and baseline validation
        working-directory: ARES-Analytics
        run: ./gradlew :app:dashboardPerformanceBaseline "-ParesVersion=${ARES_VERSION}" "-ParesRepository=${ARES_VALIDATION_REPOSITORY}" --refresh-dependencies --no-daemon

      - name: Publish validation summary
        if: always()
        working-directory: ARES-Analytics
        run: test ! -f app/build/reports/dashboard-validation/dashboard-validation-smoke.md || cat app/build/reports/dashboard-validation/dashboard-validation-smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-smoke
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/dashboard-validation/**
            ARES-Analytics/app/build/reports/tests/dashboardSmoke/**
            ARES-Analytics/app/build/test-results/dashboardSmoke/**

  soak:
    if: github.event_name == 'schedule' || github.event.inputs.profile == 'soak'
    name: Dashboard 30-minute-equivalent soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validated ARESLib contract
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: ${{ env.ARESLIB_VALIDATION_REF }}
          path: ARESLib-Kotlin

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish isolated ARESLib validation repository
        working-directory: ARESLib-Kotlin
        run: ./gradlew publishReleaseValidation "-ParesVersion=${ARES_VERSION}" --no-parallel --no-daemon

      - name: Verify the requested ARES contract was published
        working-directory: ARESLib-Kotlin
        run: test -f "build/release-repository/org/aresfirst/ares/ares-bom/${ARES_VERSION}/ares-bom-${ARES_VERSION}.pom"

      - name: Run dashboard soak validation
        working-directory: ARES-Analytics
        run: ./gradlew :app:dashboardSoak "-ParesVersion=${ARES_VERSION}" "-ParesRepository=${ARES_VALIDATION_REPOSITORY}" --refresh-dependencies --no-daemon

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-soak
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/dashboard-validation/**
            ARES-Analytics/app/build/reports/tests/dashboardSoak/**
            ARES-Analytics/app/build/test-results/dashboardSoak/**
