name: Dashboard Validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/dashboard-validation.yml'
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/dashboard-validation.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - soak

permissions:
  contents: read

concurrency:
  group: dashboard-validation-${{ github.ref }}-${{ github.event.inputs.profile || 'automatic' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'schedule' && github.event.inputs.profile != 'soak'
    name: Dashboard smoke and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ARESLib-Kotlin
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          path: ARESLib-Kotlin

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dashboard smoke and baseline validation
        working-directory: ARES-Analytics
        run: ./gradlew :app:dashboardPerformanceBaseline --no-daemon

      - name: Publish validation summary
        if: always()
        working-directory: ARES-Analytics
        run: test ! -f app/build/reports/dashboard-validation/dashboard-validation-smoke.md || cat app/build/reports/dashboard-validation/dashboard-validation-smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-smoke
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/dashboard-validation/**
            ARES-Analytics/app/build/reports/tests/dashboardSmoke/**
            ARES-Analytics/app/build/test-results/dashboardSmoke/**

  soak:
    if: github.event_name == 'schedule' || github.event.inputs.profile == 'soak'
    name: Dashboard 30-minute-equivalent soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ARESLib-Kotlin
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          path: ARESLib-Kotlin

      - name: Checkout ARES-Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dashboard soak validation
        working-directory: ARES-Analytics
        run: ./gradlew :app:dashboardSoak --no-daemon

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-soak
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/dashboard-validation/**
            ARES-Analytics/app/build/reports/tests/dashboardSoak/**
            ARES-Analytics/app/build/test-results/dashboardSoak/**
