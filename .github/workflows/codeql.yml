name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: analytics-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Check out ARESLib
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: master
          path: ARESLib-Kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-Analytics/app/src
              - ARES-Analytics/gateway/src
              - ARES-Analytics/shared/src
            paths-ignore:
              - ARESLib-Kotlin/**

      - name: Compile Analytics sources
        working-directory: ARES-Analytics
        run: ./gradlew :shared:classes :app:classes :gateway:classes --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
