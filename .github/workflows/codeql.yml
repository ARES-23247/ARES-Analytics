name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  ARESLIB_VALIDATION_REF: 653842d0b6c9b610df502f5d3b178b2a603a9a7b
  ARES_VALIDATION_REPOSITORY: file://${{ github.workspace }}/ARESLib-Kotlin/build/release-repository

concurrency:
  group: analytics-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validated ARESLib contract
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: ${{ env.ARESLIB_VALIDATION_REF }}
          path: ARESLib-Kotlin

      - name: Check out Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-Analytics/app/src
              - ARES-Analytics/gateway/src
              - ARES-Analytics/shared/src

      - name: Publish isolated ARESLib validation repository
        working-directory: ARESLib-Kotlin
        run: ./gradlew publishReleaseValidation --no-parallel --no-daemon

      - name: Compile Analytics sources
        working-directory: ARES-Analytics
        run: ./gradlew :shared:classes :app:classes :gateway:classes "-ParesRepository=${ARES_VALIDATION_REPOSITORY}" --refresh-dependencies --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
