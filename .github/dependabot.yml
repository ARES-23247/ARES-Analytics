version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      kotlin-and-compose:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.compose*", "androidx.compose*"]
        update-types: [minor, patch]
      ktor:
        patterns: ["io.ktor:*"]
        update-types: [minor, patch]
      test-tooling:
        patterns: ["org.junit*", "io.mockk*", "org.mockito*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]

